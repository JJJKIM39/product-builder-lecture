name: 📅 경제·실적 캘린더 자동 업데이트

on:
  schedule:
    - cron: '0 19 * * *'   # 매일 04:00 KST (= 19:00 UTC)
  workflow_dispatch:         # 수동 실행 버튼 (테스트용)

permissions:
  contents: write            # 결과 JSON을 repo에 커밋하기 위해 필요

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 📥 의존성 설치
        run: pip install -r crawler/requirements.txt

      - name: 🕷️ 크롤러 실행
        run: python crawler/crawl.py

      - name: 💾 변경된 calendar.json 커밋 & 푸시
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/calendar.json
          git diff --staged --quiet && echo "변경사항 없음, 스킵" || \
          git commit -m "chore: 캘린더 자동 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" && \
          git push
