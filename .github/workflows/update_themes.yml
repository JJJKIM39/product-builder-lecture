name: 📊 당일 주도 테마 AI 분석

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 평일 16:30 KST (= 07:30 UTC) — 장 마감 1시간 후
  workflow_dispatch:           # 수동 실행 버튼 (테스트용)

permissions:
  contents: write

jobs:
  analyze-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 📥 의존성 설치
        run: pip install -r crawler/requirements.txt

      - name: 🤖 테마 분석 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crawler/themes.py

      - name: 💾 themes.json 커밋 & 푸시
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/themes.json
          git diff --staged --quiet && echo "변경사항 없음, 스킵" || \
          git commit -m "chore: 테마 분석 자동 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" && \
          git push
