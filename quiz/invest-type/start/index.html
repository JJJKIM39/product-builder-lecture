:\"analytic\"},{\"text\":\"딱히 손대지 않는다\",\"type\":\"passive\"}]},{\"q\":\"주변에서 \\\"이 종목 무조건 오른다\\\"는 말을 들으면\",\"options\":[{\"text\":\"차트부터 열어 진입 타이밍을 본다\",\"type\":\"aggressive\"},{\"text\":\"어떤 산업이고 어떤 스토리인지 물어본다\",\"type\":\"bold\"},{\"text\":\"그 주장의 근거 자료가 있는지부터 확인한다\",\"type\":\"analytic\"},{\"text\":\"흘려듣는다 — 내 계획과 무관하다\",\"type\":\"passive\"}]},{\"q\":\"내 포트폴리오에서 가장 중요하게 여기는 것은\",\"options\":[{\"text\":\"현금 비중 — 기회가 오면 언제든 쓸 실탄\",\"type\":\"aggressive\"},{\"text\":\"확신 있는 소수 종목에 대한 집중\",\"type\":\"bold\"},{\"text\":\"산업·자산별 분산과 밸런스\",\"type\":\"analytic\"},{\"text\":\"낮은 비용과 시간이 대신 일하는 구조\",\"type\":\"passive\"}]},{\"q\":\"투자에서 가장 두려운 것은\",\"options\":[{\"text\":\"기회를 눈앞에서 놓치는 것\",\"type\":\"aggressive\"},{\"text\":\"내 판단이 틀렸다고 인정하게 되는 것\",\"type\":\"bold\"},{\"text\":\"분석하지 못한 변수에 당하는 것\",\"type\":\"analytic\"},{\"text\":\"원금이 크게 줄어드는 것\",\"type\":\"passive\"}]},{\"q\":\"레버리지(신용·미수)에 대한 내 생각은\",\"options\":[{\"text\":\"관리만 되면 유용한 도구다\",\"type\":\"aggressive\"},{\"text\":\"확신이 강할 때는 쓸 수 있다\",\"type\":\"bold\"},{\"text\":\"기대값과 최악의 시나리오를 계산해 본 후에만\",\"type\":\"analytic\"},{\"text\":\"원칙적으로 쓰지 않는다\",\"type\":\"passive\"}]},{\"q\":\"손실 난 투자를 복기할 때 나는\",\"options\":[{\"text\":\"진입과 청산 타이밍을 되짚는다\",\"type\":\"aggressive\"},{\"text\":\"원래 시나리오의 어느 부분이 깨졌는지 본다\",\"type\":\"bold\"},{\"text\":\"오판의 원인을 데이터로 기록해 둔다\",\"type\":\"analytic\"},{\"text\":\"애초에 무리한 시도는 아니었는지 돌아본다\",\"type\":\"passive\"}]},{\"q\":\"나에게 투자란\",\"options\":[{\"text\":\"실력을 겨루는 승부의 세계\",\"type\":\"aggressive\"},{\"text\":\"미래에 대한 베팅이자 확신의 표현\",\"type\":\"bold\"},{\"text\":\"확률과 기대값을 다루는 게임\",\"type\":\"analytic\"},{\"text\":\"노후와 자산을 지키는 수단\",\"type\":\"passive\"}]}],\"results\":{\"aggressive\":{\"name\":\"단타 승부사형\",\"tagline\":\"속도와 타이밍으로 승부하는 트레이더 기질\",\"desc\":\"당신은 시장을 '기다리는 곳'이 아니라 '움직이는 곳'으로 봅니다. 짧은 시간 안에 판단하고 실행하는 능력, 손실을 오래 붙잡지 않고 털어내는 회복력은 트레이딩에 필요한 핵심 기질입니다. 수익 확정에 미련이 없고, 현금을 '대기 자산'이 아니라 '다음 기회의 실탄'으로 보는 관점도 전형적인 단기 매매자의 사고방식입니다.\\n\\n다만 이 유형의 성패는 재능이 아니라 규율에서 갈립니다. 통계적으로 단기 매매는 참여자 대다수가 시장 평균을 하회하는 영역이며, 살아남는 소수의 공통점은 '진입 전에 손절선과 비중을 정하고, 정한 대로 지키는 것'입니다. 감이 좋은 날의 수익보다, 규칙을 어긴 날의 손실이 계좌의 운명을 결정합니다.\",\"color\":\"#D85A30\",\"strengths\":[\"판단 속도 — 제한된 정보로 빠르게 결정하고 실행한다\",\"손절 능력 — 틀린 포지션을 인정하고 끊어내는 데 미련이 없다\",\"시장 감각 — 수급과 분위기 변화를 체감으로 포착한다\",\"회복탄력성 — 손실 후에도 위축되지 않고 다음 기회를 본다\"],\"cautions\":[\"과매매 — 기회가 없는 날에도 '뭔가 해야 할 것 같은' 충동이 최대 리스크\",\"복수 매매 — 손실 직후 만회하려는 진입은 통계적으로 가장 나쁜 진입\",\"레버리지 확대 — 연승 후 비중을 늘리는 습관은 한 번의 실패로 전체를 지운다\"],\"fit\":\"명확한 규칙 기반의 단기 매매, 변동성 대응 전략, 소액 검증 후 확장하는 방식\",\"growthTip\":\"매매일지에 수익률보다 '규칙을 지켰는가'를 먼저 기록해보세요. 규칙 준수율이 곧 장기 수익률입니다.\"},\"bold\":{\"name\":\"성장 스토리형\",\"tagline\":\"확신이 서면 크게 베팅하는 비전 투자자\",\"desc\":\"당신은 숫자보다 서사를 먼저 봅니다. 이 산업이 어디로 가는지, 이 기업이 5년 뒤 어떤 위치에 있을지를 그리는 능력이 있고, 그 그림에 확신이 서면 시장의 단기 소음에 흔들리지 않고 버틸 수 있습니다. 역사상 가장 큰 투자 수익은 대부분 이런 유형 — 확신을 갖고 오래 보유한 사람들에게 돌아갔습니다.\\n\\n문제는 확신과 편향이 한 끗 차이라는 점입니다. 이 유형의 전형적인 실패는 '틀린 스토리를 너무 오래 믿는 것'입니다. 스토리에 반하는 데이터가 나왔을 때 그것을 '일시적 노이즈'로 치부하기 시작하면, 확신은 자산이 아니라 부채가 됩니다. 당신에게 필요한 것은 더 강한 확신이 아니라, 확신을 무너뜨릴 조건을 미리 적어두는 습관입니다.\",\"color\":\"#BA7517\",\"strengths\":[\"장기 시야 — 분기 실적이 아니라 산업의 방향을 본다\",\"보유력 — 단기 변동성에 흔들리지 않고 시나리오를 유지한다\",\"집중 투자 — 확신 있는 소수 종목으로 의미 있는 수익률을 만든다\",\"서사 이해 — 시장이 어떤 스토리에 돈을 태우는지 감각적으로 안다\"],\"cautions\":[\"확증 편향 — 내 논리를 지지하는 정보만 수집하게 되는 것이 최대 리스크\",\"물타기의 함정 — '더 싸졌으니 더 산다'가 유효한 건 논리가 살아있을 때뿐\",\"집중의 양면 — 소수 종목 집중은 수익도 손실도 증폭시킨다는 걸 상기할 것\"],\"fit\":\"성장 산업 장기 투자, 테마의 초기 국면 발굴, 시나리오 기반 집중 투자\",\"growthTip\":\"종목을 살 때 '이 조건이 깨지면 판다'를 함께 기록해두세요. 무효화 조건 없는 확신은 신앙입니다.\"},\"analytic\":{\"name\":\"숫자 기반형\",\"tagline\":\"감정이 아니라 데이터로 판단하는 분석가\",\"desc\":\"당신은 시장의 소음과 신호를 구분하려는 사람입니다. 남들이 '오를 것 같아서' 살 때 당신은 '왜 저평가인지'를 설명할 수 있어야 삽니다. 재무제표를 직접 확인하고, 폭락이 오면 공포보다 폭락의 성격을 먼저 분석하는 태도는 장기적으로 시장에서 살아남는 사람들의 공통된 특성입니다.\\n\\n이 유형의 함정은 역설적으로 분석 그 자체입니다. 첫째, 분석이 끝나기를 기다리다 기회가 지나가는 '분석 마비'. 둘째, 정교한 모델일수록 모델 바깥의 변수(시장 심리, 유동성, 정책)에 취약하다는 점. 시장은 스프레드시트대로 움직이지 않는 구간이 반드시 오며, 그때 필요한 건 더 정밀한 계산이 아니라 '내 분석이 틀릴 수 있다'는 여백입니다.\",\"color\":\"#185FA5\",\"strengths\":[\"리서치 능력 — 원자료(공시·재무제표)를 직접 확인하는 습관\",\"감정 통제 — 공포와 탐욕 국면에서 상대적으로 냉정을 유지한다\",\"리스크 인식 — 수익보다 '내가 모르는 변수'를 먼저 걱정한다\",\"복기 문화 — 실패를 데이터로 기록해 같은 실수를 줄여간다\"],\"cautions\":[\"분석 마비 — 확신 99%를 기다리는 동안 80%짜리 기회들이 지나간다\",\"모델 과신 — 숫자에 잡히지 않는 변수(심리·수급)를 과소평가하기 쉽다\",\"타이밍 취약 — '싸다'는 판단과 '오른다'는 판단은 다른 문제임을 유의\"],\"fit\":\"가치 기반 종목 발굴, 실적 시즌 중심 매매, 리서치가 보상받는 중장기 투자\",\"growthTip\":\"분석 노트에 결론과 함께 '이 판단의 유효기간'을 적어보세요. 낡은 분석을 새 확신처럼 쓰는 걸 막아줍니다.\"},\"passive\":{\"name\":\"안정 추구형\",\"tagline\":\"시간을 내 편으로 만드는 장기 설계자\",\"desc\":\"당신은 시장을 이기려 하기보다 시장과 함께 가는 쪽을 선택하는 사람입니다. 수익률 확인을 자주 하지 않고, 폭락 뉴스에도 적립을 계속하는 태도는 사실 행동재무학이 말하는 '개인 투자자의 가장 흔한 실패 — 잦은 매매와 감정적 대응'을 구조적으로 차단하는 방식입니다. 화려하지 않지만, 장기 데이터가 가장 일관되게 지지하는 접근이기도 합니다.\\n\\n다만 '신경 쓰지 않는 것'과 '방치하는 것'은 다릅니다. 이 유형의 리스크는 시장이 아니라 무관심에서 옵니다. 비용이 높은 상품을 그대로 두거나, 자산 배분이 목표와 어긋난 채 몇 년이 흐르거나, 인플레이션 대비가 빠진 포트폴리오를 유지하는 것. 1년에 몇 번만이라도 구조를 점검하는 최소한의 관리가 이 전략의 완성입니다.\",\"color\":\"#3B6D11\",\"strengths\":[\"행동 규율 — 시장 공포 국면에서 팔지 않는 것 자체가 큰 우위\",\"비용 감각 — 잦은 매매가 없어 수수료와 세금 누수가 적다\",\"복리 활용 — 시간을 수익의 핵심 엔진으로 쓸 줄 안다\",\"심리 안정 — 투자가 일상과 정신 건강을 침식하지 않는다\"],\"cautions\":[\"방치 리스크 — '장기 투자'가 '점검 없는 투자'가 되지 않도록 주의\",\"기회 인식 부족 — 구조적 변화(산업 전환 등)까지 무시하면 장기 수익이 잠식된다\",\"인플레이션 — 현금성 자산 비중이 과하면 '잃지 않는 것'이 곧 잃는 것이 된다\"],\"fit\":\"인덱스 중심의 적립식 투자, 배당 성장 전략, 연 1~2회 리밸런싱 구조\",\"growthTip\":\"1년에 두 번, 날짜를 정해 포트폴리오 점검일을 만들어보세요. 그 이틀이 나머지 363일의 무관심을 정당화해줍니다.\"}}}}],null],null],null]},[null,[\"$\",\"$L6\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$7\",\"children\",\"start\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L8\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L6\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$7\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"e
