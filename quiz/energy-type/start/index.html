'넘을 대상'으로 본다\"],\"cautions\":[\"속도전이 습관이 되면 검토가 필요한 결정까지 즉흥적으로 내릴 수 있다\",\"느린 사람을 '무능'으로 오독하기 쉽다 — 신중함과 우유부단은 다르다\",\"성과가 없는 휴식을 견디지 못해 번아웃 신호를 놓치는 경향이 있다\"],\"fit\":\"빠른 의사결정이 필요한 환경 — 창업, 영업, 프로젝트 리딩, 위기관리\",\"growthTip\":\"일주일에 한 번, 결정하기 전에 '반대하는 사람의 논리'를 먼저 소리 내어 말해보세요.\"},\"yellow\":{\"name\":\"옐로우 · 확산형\",\"tagline\":\"사람과 가능성에서 에너지를 만드는 사람\",\"desc\":\"옐로우 유형은 방 안의 온도를 바꾸는 사람입니다. 처음 만난 사람과도 10분 안에 웃음 코드를 찾아내고, 무거운 회의도 당신이 입을 열면 공기가 가벼워집니다. 아이디어가 마르지 않는 것도 특징인데, 이는 세상을 '고정된 것'이 아니라 '아직 시도 안 해본 조합들의 집합'으로 보기 때문입니다.\\n\\n옐로우의 진짜 능력은 연결입니다. 사람과 사람, 아이디어와 아이디어를 잇는 자리에서 대체 불가능한 가치를 만듭니다. 다만 시작의 설렘이 마무리의 지루함을 이기지 못해, 벌려놓은 일이 쌓이는 것이 고질적인 패턴입니다. 옐로우에게 필요한 건 더 많은 아이디어가 아니라, 아이디어를 끝까지 데려가 줄 구조와 파트너입니다.\",\"color\":\"#BA7517\",\"strengths\":[\"친화력 — 낯선 집단에도 빠르게 스며들고 네트워크를 만든다\",\"낙관성 — 막힌 상황에서도 '다른 길'을 보는 프레임 전환이 빠르다\",\"발상력 — 서로 무관해 보이는 것들을 연결해 새로운 아이디어를 만든다\",\"분위기 감각 — 팀의 사기와 에너지 레벨을 감지하고 끌어올린다\"],\"cautions\":[\"시작 대비 완료율이 낮아지기 쉽다 — 열정의 유통기한을 인정하고 설계할 것\",\"'좋은 게 좋은 것'이 과하면 필요한 갈등까지 회피하게 된다\",\"혼자 있는 시간이 부족하면 자기 생각과 남의 반응을 구분하기 어려워진다\"],\"fit\":\"사람과 아이디어가 오가는 환경 — 마케팅, 기획, 커뮤니티, 교육, 콘텐츠\",\"growthTip\":\"새 일을 벌리기 전에 '지금 진행 중인 것 중 하나를 끝내면 시작한다'는 규칙을 걸어보세요.\"},\"blue\":{\"name\":\"블루 · 침잠형\",\"tagline\":\"깊이 파고들 때 가장 강해지는 사람\",\"desc\":\"블루 유형은 '왜?'를 세 번 이상 묻는 사람입니다. 남들이 표면의 답에 만족할 때 당신은 그 아래의 구조를 봅니다. 대화보다 관찰에서, 소음보다 몰입에서 에너지를 얻고, 한 가지 주제를 오래 붙잡고 있는 것이 지루함이 아니라 즐거움입니다.\\n\\n이 깊이는 블루의 가장 큰 자산이지만, 동시에 함정이 되기도 합니다. 완벽한 분석을 기다리다 타이밍을 놓치거나, 머릿속 기준이 너무 높아 시작 자체를 미루는 패턴입니다. 블루가 기억해야 할 것은, 세상의 대부분의 문제는 '80% 확신 + 실행'이 '99% 확신 + 대기'를 이긴다는 사실입니다. 당신의 분석력은 실행과 결합될 때 비로소 무기가 됩니다.\",\"color\":\"#185FA5\",\"strengths\":[\"분석력 — 현상 뒤의 원인과 구조를 파악하는 속도가 남다르다\",\"독립성 — 다수의 의견에 휩쓸리지 않고 자기 기준으로 판단한다\",\"완성도 — 맡은 일의 디테일과 품질에 대한 기준이 높다\",\"통찰 — 오래 관찰한 만큼 남들이 못 보는 패턴을 발견한다\"],\"cautions\":[\"분석이 길어지면 '준비'가 '회피'로 변질될 수 있다\",\"생각을 공유하지 않으면 주변에서는 '무관심'으로 읽힌다\",\"자기 기준이 높은 만큼 자기비판도 과해지기 쉽다 — 복기와 자책을 구분할 것\"],\"fit\":\"깊이가 보상받는 환경 — 리서치, 개발, 전략, 투자 분석, 전문 분야\",\"growthTip\":\"분석이 70% 끝났다고 느껴지면,
